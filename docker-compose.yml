services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: razorrecover
      POSTGRES_PASSWORD: razorrecover_dev
      POSTGRES_DB: razorrecover
    ports:
      - "5432:5432"
    volumes:
      - razorrecover_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorrecover -d razorrecover"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://razorrecover:razorrecover_dev@postgres:5432/razorrecover
      # AI_PROVIDER defaults to "none" (deterministic fallback rules) so the
      # whole stack runs with zero external credentials -- override via a
      # real .env file or `docker compose --env-file` if you have API keys.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      USE_RAZORPAY_TEST_MODE: ${USE_RAZORPAY_TEST_MODE:-false}
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  razorrecover_pgdata:
